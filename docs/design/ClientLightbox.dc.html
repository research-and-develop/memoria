<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Photo view</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Instrument+Serif:ital@0;1&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#F1F0EC}a:hover{color:#FFFFFF}
</style>
</helmet>
<div style="min-height: 100vh; display: flex; flex-direction: column; background: #0F1011; color: #F1F0EC; font-family: Inter, system-ui, sans-serif; font-size: 14px; line-height: 1.45">

  <header style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 10px clamp(12px, 2vw, 24px)">
    <a href="ClientGallery.dc.html" style="display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 12px 0 6px; border-radius: 999px; text-decoration: none; font-weight: 600"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>Ceremony</a>
    <span style="flex: 1; text-align: center; color: #A9ABAF; font-size: 13px">23 of 210</span>
    <div style="display: flex; gap: 6px">
      <button type="button" aria-pressed="{{compare}}" onClick="{{toggleCompare}}" style="display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 12px; border-radius: 999px; border: 1px solid #34363A; font: inherit; font-weight: 600; cursor: pointer; background: {{cmpBg}}; color: {{cmpFg}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><rect x="3" y="4" width="8" height="16" rx="1"></rect><rect x="13" y="4" width="8" height="16" rx="1"></rect></svg>Compare</button>
      <button type="button" aria-label="Full screen" style="width: 44px; height: 44px; display: grid; place-items: center; border-radius: 999px; border: 1px solid #34363A; background: transparent; color: #F1F0EC; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"></path></svg></button>
      <a href="ClientGallery.dc.html" aria-label="Close" style="width: 44px; height: 44px; display: grid; place-items: center; border-radius: 999px; border: 1px solid #34363A"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"></path></svg></a>
    </div>
  </header>

  <div style="flex: 1; display: flex; flex-wrap: wrap; min-height: 0">
    <div style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 12px; padding: 8px clamp(12px, 2vw, 24px) 16px">
      <div style="position: relative; flex: 1; min-height: 520px; display: flex; align-items: center; justify-content: center; gap: 12px">
        <button type="button" aria-label="Previous photo" style="position: absolute; left: 0; top: 50%; transform: translateY(-50%); width: 48px; height: 48px; border-radius: 999px; border: 0; background: rgba(255,255,255,0.08); color: #F1F0EC; display: grid; place-items: center; cursor: pointer; z-index: 1"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></button>
        <sc-if value="{{compare}}" hint-placeholder-val="{{ false }}">
          <div style="display: flex; flex-direction: column; gap: 8px; align-items: center; width: 42%; max-width: 440px">
            <div style="width: 100%; aspect-ratio: 2 / 3; background: linear-gradient(180deg, #D6CABB 0 60%, #8C7B6B 60% 100%)"></div>
            <span style="font-size: 12px; color: #A9ABAF">DSC_0478</span>
          </div>
        </sc-if>
        <div style="display: flex; flex-direction: column; gap: 8px; align-items: center; width: {{mainW}}; max-width: 440px">
          <div style="width: 100%; aspect-ratio: 2 / 3; background: linear-gradient(180deg, #C9BBA8 0 56%, #6E5A4C 56% 100%)"></div>
          <sc-if value="{{compare}}" hint-placeholder-val="{{ false }}"><span style="font-size: 12px; color: #A9ABAF">DSC_0481</span></sc-if>
        </div>
        <button type="button" aria-label="Next photo" style="position: absolute; right: 0; top: 50%; transform: translateY(-50%); width: 48px; height: 48px; border-radius: 999px; border: 0; background: rgba(255,255,255,0.08); color: #F1F0EC; display: grid; place-items: center; cursor: pointer; z-index: 1"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"></path></svg></button>
      </div>
      <div role="list" aria-label="Filmstrip" style="display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px">
        <sc-for list="{{strip}}" as="f" hint-placeholder-count="14">
          <span role="listitem" style="flex: none; width: 64px; height: 64px; border-radius: 4px; background: {{f.bg}}; box-shadow: {{f.ring}}; opacity: {{f.op}}"></span>
        </sc-for>
      </div>
      <span style="font-size: 12px; color: #A9ABAF; text-align: center">Arrow keys to move · F to favorite · Space for slideshow</span>
    </div>

    <aside aria-label="Photo actions" style="flex: 1 1 320px; box-sizing: border-box; padding: 16px 20px 24px; background: #17191B; border-left: 1px solid #26282B; display: flex; flex-direction: column; gap: 20px">
      <button type="button" aria-pressed="{{fav}}" onClick="{{toggleFav}}" style="display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 52px; border-radius: 12px; font: inherit; font-size: 16px; font-weight: 600; cursor: pointer; border: 1.5px solid {{favBorder}}; background: {{favBg}}; color: {{favFg}}">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="{{favFill}}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z"></path></svg>
        {{favLabel}}
      </button>

      <div style="display: flex; flex-direction: column; gap: 8px">
        <span style="font-size: 12px; font-weight: 600; color: #A9ABAF; text-transform: uppercase; letter-spacing: 0.08em">Add to list</span>
        <sc-for list="{{lists}}" as="l" hint-placeholder-count="3">
          <button type="button" role="checkbox" aria-checked="{{l.on}}" onClick="{{l.flip}}" style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 12px; border-radius: 10px; border: 1px solid #2E3033; background: transparent; color: #F1F0EC; font: inherit; cursor: pointer; text-align: left">
            <span style="width: 20px; height: 20px; border-radius: 5px; display: grid; place-items: center; font-size: 13px; font-weight: 700; color: #0F1011; background: {{l.box}}; border: 1.5px solid {{l.boxBorder}}">{{l.mark}}</span>
            <span style="flex: 1">{{l.name}}</span>
            <span style="font-size: 12px; color: #A9ABAF">{{l.count}}</span>
          </button>
        </sc-for>
        <button type="button" style="align-self: flex-start; min-height: 36px; padding: 0 4px; border: 0; background: transparent; color: #8FD3BF; font: inherit; font-weight: 600; cursor: pointer">+ New list</button>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px">
        <span style="font-size: 12px; font-weight: 600; color: #A9ABAF; text-transform: uppercase; letter-spacing: 0.08em">Ask for a retouch</span>
        <div style="display: flex; flex-wrap: wrap; gap: 6px">
          <sc-for list="{{retouch}}" as="r" hint-placeholder-count="5">
            <button type="button" aria-pressed="{{r.on}}" onClick="{{r.flip}}" style="min-height: 36px; padding: 0 12px; border-radius: 999px; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; border: 1px solid {{r.border}}; background: {{r.bg}}; color: {{r.fg}}">{{r.label}}</button>
          </sc-for>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 10px">
        <span style="font-size: 12px; font-weight: 600; color: #A9ABAF; text-transform: uppercase; letter-spacing: 0.08em">Notes for Niko</span>
        <div style="display: flex; gap: 10px">
          <span style="width: 28px; height: 28px; flex: none; border-radius: 999px; background: #2E3033; display: grid; place-items: center; font-size: 11px; font-weight: 700">J</span>
          <div style="display: flex; flex-direction: column"><span style="font-size: 13px"><strong>Jonas</strong> · yesterday</span><span style="font-size: 13px; color: #D4D3CF">Can we lose the exit sign behind us?</span></div>
        </div>
        <div style="display: flex; gap: 10px">
          <span style="width: 28px; height: 28px; flex: none; border-radius: 999px; background: #1F6F5C; display: grid; place-items: center; font-size: 11px; font-weight: 700">N</span>
          <div style="display: flex; flex-direction: column"><span style="font-size: 13px"><strong>Niko</strong> · photographer</span><span style="font-size: 13px; color: #D4D3CF">Absolutely — it’ll be gone in the final.</span></div>
        </div>
        <label style="display: flex; gap: 8px; align-items: center">
          <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Write a note</span>
          <input type="text" placeholder="Write a note…" style="flex: 1; min-width: 0; min-height: 44px; padding: 0 12px; border-radius: 10px; border: 1px solid #34363A; background: #0F1011; color: #F1F0EC; font: inherit">
          <button type="button" style="min-height: 44px; padding: 0 14px; border-radius: 10px; border: 0; background: #F1F0EC; color: #0F1011; font: inherit; font-weight: 600; cursor: pointer">Send</button>
        </label>
      </div>

      <div style="margin-top: auto; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
        <button type="button" style="display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; border-radius: 10px; border: 1px solid #34363A; background: transparent; color: #F1F0EC; font: inherit; font-weight: 600; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><path d="M7 10l5 5 5-5"></path><path d="M12 15V3"></path></svg>Download</button>
        <button type="button" style="display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; border-radius: 10px; border: 0; background: #F1F0EC; color: #0F1011; font: inherit; font-weight: 600; cursor: pointer">Buy a print</button>
      </div>
    </aside>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { fav: true, compare: false, lists: { Album: true, 'Print wall': false, Grandma: true }, retouch: { 'Remove object': true } };
  }
  renderVals() {
    const s = this.state;
    const accent = '#E08A5C';
    const lists = [['Album', 41], ['Print wall', 6], ['Grandma', 12]].map(([name, count]) => {
      const on = !!s.lists[name];
      return { name, count, on, mark: on ? '✓' : '', box: on ? '#F1F0EC' : 'transparent', boxBorder: on ? '#F1F0EC' : '#5A5D62', flip: () => this.setState({ lists: Object.assign({}, this.state.lists, { [name]: !this.state.lists[name] }) }) };
    });
    const retouch = ['Remove object', 'Black & white', 'Brighter', 'Crop tighter', 'Skin softening'].map((label) => {
      const on = !!s.retouch[label];
      return { label, on, border: on ? '#8FD3BF' : '#34363A', bg: on ? 'rgba(143,211,191,0.14)' : 'transparent', fg: on ? '#8FD3BF' : '#D4D3CF', flip: () => this.setState({ retouch: Object.assign({}, this.state.retouch, { [label]: !this.state.retouch[label] }) }) };
    });
    const tones = ['#C8BBAA', '#94A39A', '#B9A99A', '#6E5A4C', '#D6CABB', '#5E6B63', '#C9BBA8', '#A3876A', '#7A6F64', '#E2D7CA', '#3F4A52', '#8C7B6B', '#4E5B57', '#B0A08F'];
    const strip = tones.map((bg, i) => ({ bg, ring: i === 6 ? '0 0 0 2px #F1F0EC' : 'none', op: i === 6 ? 1 : 0.6 }));
    return {
      fav: s.fav, favLabel: s.fav ? 'In your favorites' : 'Add to favorites',
      favFill: s.fav ? accent : 'none', favBorder: s.fav ? accent : '#34363A', favBg: s.fav ? 'rgba(224,138,92,0.12)' : 'transparent', favFg: s.fav ? '#F4B190' : '#F1F0EC',
      toggleFav: () => this.setState({ fav: !this.state.fav }),
      compare: s.compare, mainW: s.compare ? '42%' : '100%',
      cmpBg: s.compare ? '#F1F0EC' : 'transparent', cmpFg: s.compare ? '#0F1011' : '#F1F0EC',
      toggleCompare: () => this.setState({ compare: !this.state.compare }),
      lists, retouch, strip
    };
  }
}
</script>
</body>
</html>
