# CI/CD (runbook: docs/deployment.md)
#
#   merge request   → check, build, preview (manual)
#   default branch  → check, build, deploy (MANUAL: press ▶ to ship; migrations first, then the Worker)
#   schedule        → backup only (a D1 SQL export kept as an artifact)
#
# CI/CD variables (Settings → CI/CD → Variables, masked + protected):
#   CLOUDFLARE_API_TOKEN   an ACCOUNT API token: Workers: Editor, D1: Edit, Account Settings: Read
#   CLOUDFLARE_ACCOUNT_ID  the Cloudflare account id
# App secrets are NOT here: they live in Cloudflare (`wrangler secret put`).

# Debian, not Alpine: workerd (the D1 tests, `wrangler`) needs glibc.
image: node:24-bookworm

stages:
  - check
  - build
  - deploy
  - backup

variables:
  npm_config_cache: '$CI_PROJECT_DIR/.npm'
  CI: 'true'
  WRANGLER_SEND_METRICS: 'false'

# Merge requests and the default branch only — a plain branch push runs nothing
# until it has an MR, so a branch never gets duplicate pipelines.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

.not-on-schedule:
  rules:
    - if: $CI_PIPELINE_SOURCE == 'schedule'
      when: never
    - when: on_success

default:
  cache:
    key:
      files: [package-lock.json]
    paths: [.npm/]
  before_script:
    - npm ci --no-audit --no-fund

check:
  stage: check
  extends: .not-on-schedule
  script:
    - npm run ts-check
    - npm run test

build:
  stage: build
  extends: .not-on-schedule
  needs: [check]
  script:
    - npm run build:worker
  artifacts:
    paths: [apps/web/.open-next/]
    expire_in: 1 day

# Production, one deploy at a time. Migrations run BEFORE the new code goes
# live, so every migration must work with the code still running.
deploy:
  stage: deploy
  needs: [build]
  rules:
    - if: $CI_PIPELINE_SOURCE == 'schedule'
      when: never
    # Manual by design: a push never goes live by itself. allow_failure keeps
    # the pipeline green while it waits.
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
  resource_group: production
  environment:
    name: production
  script:
    - npm run db:migrate:remote
    - cd apps/web && npx opennextjs-cloudflare deploy

# A preview version (not live) with its own URL. It uses the PRODUCTION
# bindings (D1), so run it only for changes that are safe against production data.
preview:
  stage: deploy
  needs: [build]
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
      when: manual
  allow_failure: true
  environment:
    name: review/$CI_COMMIT_REF_SLUG
    url: $PREVIEW_URL
  script:
    - cd apps/web && npx opennextjs-cloudflare upload 2>&1 | tee upload.log
    - echo "PREVIEW_URL=$(grep -oE 'https://[^ ]+\.workers\.dev' upload.log | tail -1)" > "$CI_PROJECT_DIR/preview.env"
  artifacts:
    reports:
      dotenv: preview.env

# Scheduled backup: CI/CD → Schedules → new schedule on the default branch, at
# night (an export briefly blocks other D1 queries). Keep a copy outside CI.
backup:
  stage: backup
  rules:
    - if: $CI_PIPELINE_SOURCE == 'schedule'
  needs: []
  resource_group: production
  script:
    - cd apps/web
    - STAMP=$(date -u +%Y%m%d-%H%M)
    - npx wrangler d1 export DB --remote --output="$CI_PROJECT_DIR/d1-$STAMP.sql"
    - gzip "$CI_PROJECT_DIR/d1-$STAMP.sql"
  artifacts:
    name: d1-backup-$CI_PIPELINE_ID
    paths: [d1-*.sql.gz]
    expire_in: 90 days
