# Nightly D1 backup: a SQL export, gzipped and encrypted with a passphrase, kept as a workflow
# artifact for 90 days. Runbook and restore steps: docs/deployment.md → Backups.
#
# Dormant until the production D1 exists: set the repository VARIABLE D1_BACKUP_ENABLED=true
# (Settings → Secrets and variables → Actions → Variables) after the first `db:migrate:remote`.
# Repository secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID (as for deploy) and
# D1_BACKUP_PASSPHRASE (keep a copy outside GitHub: without it the backups cannot be read).
name: Backup

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    if: vars.D1_BACKUP_ENABLED == 'true'
    runs-on: ubuntu-latest
    # An export briefly blocks other D1 queries; never run it during a deploy.
    concurrency:
      group: production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_BACKUP_PASSPHRASE: ${{ secrets.D1_BACKUP_PASSPHRASE }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Export, compress and encrypt
        working-directory: apps/web
        run: |
          if [ -z "$D1_BACKUP_PASSPHRASE" ]; then
            echo "::error::D1_BACKUP_PASSPHRASE is not set"; exit 1
          fi
          npx wrangler d1 export DB --remote --output=d1.sql
          gzip -9 d1.sql
          gpg --batch --yes --pinentry-mode loopback --symmetric --cipher-algo AES256 \
            --passphrase "$D1_BACKUP_PASSPHRASE" d1.sql.gz
          rm d1.sql.gz
      - uses: actions/upload-artifact@v4
        with:
          name: d1-${{ github.run_id }}
          path: apps/web/d1.sql.gz.gpg
          retention-days: 90
          if-no-files-found: error
