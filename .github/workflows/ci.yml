# CI: check and build on every push to master and every pull request; deploy is manual.
#   push to master / pull request → check (ts-check, test, build:worker)
#   deploy                        → manual: Actions → CI → Run workflow, tick `deploy`
#                                   (migrations first, then the Worker). Works only after the first
#                                   manual deploy has created the D1 (docs/deployment.md).
# Repository secrets: CLOUDFLARE_API_TOKEN (an account token: Workers: Editor, D1: Edit,
# Account Settings: Read) and CLOUDFLARE_ACCOUNT_ID. App secrets live in Cloudflare.
# The scheduled D1 backup is a separate workflow: backup.yml.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: Migrate the production D1 and deploy the Worker
        type: boolean
        default: false

permissions:
  contents: read

# A newer push to a branch cancels its older run; runs on master always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      # Informational only: the accepted build-time advisories are listed in docs/deployment.md.
      - run: npm audit --omit=dev --audit-level=high || true
      - run: npm run ts-check
      - run: npm run test
      - run: npm run build:worker

  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    needs: [check]
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      # Migrations BEFORE the code: each must be safe for the version still running.
      - run: npm run db:migrate:remote
      - run: npm run deploy
